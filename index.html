<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汇友机电 - 库存查看</title>
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="汇友机电">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#2196F3">
    <meta name="msapplication-TileColor" content="#2196F3">
    
    <!-- Icons -->
    <link rel="apple-touch-icon" sizes="120x120" href="logo.png">
    <link rel="apple-touch-icon" sizes="152x152" href="logo.png">
    <link rel="apple-touch-icon" sizes="180x180" href="logo.png">
    <link rel="icon" type="image/png" sizes="192x192" href="logo.png">
    <link rel="manifest" href="manifest.json">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <img src="logo.png" alt="汇友机电" class="logo">
                <h1>汇友机电库存</h1>
            </div>
        </header>

        <!-- 密码输入界面 -->
        <div class="password-screen" id="passwordScreen">
            <div class="password-box">
                <div class="password-header">
                    <img src="logo.png" alt="汇友机电" class="password-logo">
                    <h2>请输入访问密码</h2>
                </div>
                <input type="password" id="passwordInput" placeholder="输入密码查看库存数据">
                <button onclick="unlockData()">解锁数据</button>
                <div class="error-message" id="errorMessage"></div>
            </div>
        </div>

        <!-- 主界面（解锁后显示） -->
        <div class="main-content" id="mainContent" style="display: none;">
            <!-- 视图模式切换 -->
            <div class="view-switcher">
                <button id="mainViewBtn" class="view-btn active">主页面</button>
                <button id="customerViewBtn" class="view-btn">查询指定客户</button>
            </div>

            <!-- 客户选择界面（查询指定客户模式） -->
            <div class="customer-selection-screen" id="customerSelectionScreen" style="display: none;">
                <div class="customer-selection-title">查询客户专属价格</div>
                
                <!-- 客户搜索 -->
                <div class="customer-search-box">
                    <input type="text" id="customerSearchInput" placeholder="🔍 搜索客户名称...">
                    <div class="customer-search-stats" id="customerSearchStats"></div>
                </div>
                
                <div class="customer-buttons" id="customerButtons">
                    <!-- 客户按钮将通过JS动态生成 -->
                </div>
            </div>

            <!-- 客户专属商品界面 -->
            <div class="customer-products-screen" id="customerProductsScreen" style="display: none;">
                <div class="customer-header">
                    <div class="customer-name" id="currentCustomerName"></div>
                    <div class="customer-actions">
                        <button id="backToCustomerSelect" class="action-btn">← 返回客户选择</button>
                        <button id="switchCustomer" class="action-btn">切换客户</button>
                    </div>
                </div>
                
                <!-- 客户专属商品的筛选区域 -->
                <div class="customer-filter-section">
                    <div class="filter-row">
                        <div class="filter-group">
                            <select id="customerCategoryFilter">
                                <option value="">全部分类</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <select id="customerStockFilter">
                                <option value="">全部状态</option>
                                <option value="instock">有库存</option>
                                <option value="lowstock">库存不足</option>
                                <option value="outstock">缺货</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- 客户专属商品的搜索 -->
                <div class="customer-search-box">
                    <input type="text" id="customerProductSearchInput" placeholder="🔍 搜索商品名称或规格...">
                    <div class="customer-search-stats" id="customerProductSearchStats"></div>
                </div>
            </div>

            <!-- 主页面内容 -->
            <div class="main-view-content" id="mainViewContent">
                <!-- 客户选择器（主页面模式） -->
                <div class="customer-selector">
                    <select id="customerSelect">
                        <option value="">通用价格</option>
                    </select>
                </div>

            <!-- 筛选区域 -->
            <div class="filter-section">
                <div class="filter-row">
                    <div class="filter-group">
                        <select id="categoryFilter">
                            <option value="">全部分类</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <select id="stockFilter">
                            <option value="">全部状态</option>
                            <option value="instock">有库存</option>
                            <option value="lowstock">库存不足</option>
                            <option value="outstock">缺货</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="在已筛选结果中搜索...">
                <div class="search-stats" id="searchStats"></div>
            </div>
            </div>
            
            <div class="product-list" id="productList">
                <div class="loading">正在加载商品数据...</div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <script src="script.js"></script>
    
    <!-- Register Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('./sw.js')
                    .then(function(registration) {
                        console.log('SW registered: ', registration);
                    })
                    .catch(function(registrationError) {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</body>
</html>
